name: Validate research artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q4 Paper Code/OCC_Esemble_Anomaly_Detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile run_experiment.py verify_results.py tests/smoke_pipeline.py
      - name: Verify archived outputs and scientific invariants
        run: python verify_results.py
